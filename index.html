<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>內嵌實測</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0 auto; max-width: 720px; padding: 16px; font: 16px/1.6 system-ui, sans-serif; background: #faf7f2; color: #222; }
  h2 { margin: 24px 0 8px; font-size: 18px; }
  .frame { aspect-ratio: 16 / 9; background: #ddd; }
  .frame iframe { width: 100%; height: 100%; border: 0; display: block; }
  .status { margin: 8px 0; padding: 8px 12px; background: #fff; border: 1px solid #ccc; overflow-wrap: anywhere; }
  a { color: #0645ad; }
</style>
</head>
<body>
<h1>內嵌實測</h1>
<p>這裡顯示的是偵測結果。請按 A 的播放鍵，看影片能否播放。</p>

<h2>A. 私人影片</h2>
<div class="frame"><div id="private"></div></div>
<div class="status" id="private-status">等待載入…</div>

<h2>B. 在 YouTube 開啟同一支影片</h2>
<p><a id="watch">在 YouTube 開啟</a></p>

<script>
  var VIDEOS = { private: 'L-O2CtBswVY' };
  var results = window.embedResults = {};

  function report(key, text) {
    results[key] = results[key] || [];
    results[key].push(text);
    document.getElementById(key + '-status').textContent = results[key].join(' → ');
  }

  document.getElementById('watch').href = 'https://www.youtube.com/watch?v=' + VIDEOS.private;

  function onYouTubeIframeAPIReady() {
    Object.keys(VIDEOS).forEach(function (key) {
      new YT.Player(key, {
        videoId: VIDEOS[key],
        playerVars: { playsinline: 1, rel: 0 },
        events: {
          onReady: function () { report(key, '播放器就緒'); },
          onStateChange: function (e) { report(key, '狀態 ' + e.data); },
          onError: function (e) { report(key, '錯誤碼 ' + e.data); }
        }
      });
    });
  }
</script>
<script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
